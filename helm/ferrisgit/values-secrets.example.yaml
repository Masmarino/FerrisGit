# Copy to values-secrets.yaml (git-ignored) and pass it with --values only when `lookup` cannot see the existing Secret
# (helm template, Argo CD, Flux) or to choose the values yourself on the first install.
secrets:
  postgresPassword: "change-me"
  # At least 32 characters.
  jwtSecret: "change-me-to-a-long-random-string-of-32+"
  # EXACTLY 32 characters, never changed afterwards.
  settingsEncryptionKey: "change-me-32-bytes-exactly-01234"
  # At least 8 characters.
  bootstrapAdminPassword: "change-me-please"
