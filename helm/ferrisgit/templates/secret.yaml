{{- $secretName := include "ferrisgit.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $stored := dict }}
{{- if $existing }}
{{- $stored = $existing.data | default dict }}
{{- end }}
{{- /* PostgreSQL only reads POSTGRES_PASSWORD when it initialises an empty volume, so once stored it stays. */ -}}
{{- $postgresPassword := get $stored "POSTGRES_PASSWORD" | b64dec | default .Values.secrets.postgresPassword | default (randAlphaNum 32) }}
{{- /* For the others, an explicit value wins over the stored one, which wins over a generated one. */ -}}
{{- $jwtSecret := .Values.secrets.jwtSecret | default (get $stored "JWT_SECRET" | b64dec) | default (randAlphaNum 48) }}
{{- $encryptionKey := .Values.secrets.settingsEncryptionKey | default (get $stored "SETTINGS_ENCRYPTION_KEY" | b64dec) | default (randAlphaNum 32) }}
{{- $bootstrapAdminPassword := .Values.secrets.bootstrapAdminPassword | default (get $stored "BOOTSTRAP_ADMIN_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
{{- if lt (len $jwtSecret) 32 }}
{{- fail "secrets.jwtSecret must be at least 32 characters long" }}
{{- end }}
{{- if ne (len $encryptionKey) 32 }}
{{- fail "secrets.settingsEncryptionKey must be exactly 32 characters long" }}
{{- end }}
{{- if lt (len $bootstrapAdminPassword) 8 }}
{{- fail "secrets.bootstrapAdminPassword must be at least 8 characters long" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ferrisgit.labels" . | nindent 4 }}
  annotations:
    # Losing this Secret loses the database login and the key the stored secrets are encrypted with.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
  SETTINGS_ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ $bootstrapAdminPassword | quote }}
  # Built here rather than as a $(POSTGRES_PASSWORD) reference in the Deployment, since Kubernetes expands $(VAR) only in
  # plain `value:` variables, never in secretKeyRef ones. The password is percent-encoded (urlquery writes a space as `+`).
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgres.user ($postgresPassword | urlquery | replace "+" "%20") .Release.Name .Values.postgres.database | quote }}
