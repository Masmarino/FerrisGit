{{- if and .Values.ingress.enabled (not (include "ferrisgit.trustedProxyCidrs" .)) (not .Values.ferrisgit.allowSharedRateLimit) }}
{{- fail "ferrisgit.trustedProxyCidrs is empty or blank: behind the ingress every visitor would share one sign-in/registration rate-limit budget. Set it to the ingress controller's pod CIDR(s), e.g. --set-string ferrisgit.trustedProxyCidrs=10.42.0.0/16 (escape commas as \\, between several), or set ferrisgit.allowSharedRateLimit=true to accept the shared budget." }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-storage
  labels:
    {{- include "ferrisgit.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "ferrisgit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate # one ReadWriteOnce volume: a rolling update would leave the second pod waiting for it forever
  selector:
    matchLabels:
      {{- include "ferrisgit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "ferrisgit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        # Restarts the pod when a secret value changes (for instance one set explicitly on upgrade).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.kubernetesExecutor.enabled }}
      # The engine creates the job Pods with this token (see rbac.yaml).
      serviceAccountName: {{ include "ferrisgit.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ferrisgit-server
          image: {{ include "ferrisgit.image" . | quote }}
          imagePullPolicy: {{ include "ferrisgit.pullPolicy" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferrisgit.secretName" . }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferrisgit.secretName" . }}
                  key: JWT_SECRET
            - name: SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferrisgit.secretName" . }}
                  key: SETTINGS_ENCRYPTION_KEY
            {{- if .Values.ferrisgit.bootstrapAdminUsername }}
            - name: FERRISGIT_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.ferrisgit.bootstrapAdminUsername | quote }}
            - name: FERRISGIT_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferrisgit.secretName" . }}
                  key: BOOTSTRAP_ADMIN_PASSWORD
            {{- end }}
            - name: PUBLIC_URL
              value: {{ include "ferrisgit.publicUrl" . | quote }}
            {{- if include "ferrisgit.trustedProxyCidrs" . }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ include "ferrisgit.trustedProxyCidrs" . | quote }}
            {{- end }}
            - name: STORAGE_ROOT
              value: /data
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: {{ .Values.ferrisgit.rustLog | quote }}
            # Read-only root filesystem, and the image's home (/app) isn't writable.
            - name: HOME
              value: /tmp
            {{- with .Values.ferrisgit.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          # Migrations run before the port opens, so the first answer can take up to 5 minutes; after that liveness takes
          # over. /healthz means the process is up, /readyz that the database answers (within 2 seconds), so a database
          # outage takes the pod out of the Service without restarting it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-storage
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "ferrisgit.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ferrisgit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
