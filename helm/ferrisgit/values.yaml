image:
  repository: masmarino/ferrisgit
  # Required: a release tag like 1.4.2 (CI passes the one it just pushed). latest works but is always pulled.
  tag: ""
  # Optional sha256:... digest. The pod then runs exactly that image, whatever the tag points to later.
  digest: ""
  pullPolicy: IfNotPresent

# Names of existing docker-registry Secrets, for a private registry.
imagePullSecrets: []

# One replica only: the Git repositories and release assets live on a single ReadWriteOnce volume.
replicaCount: 1

service:
  port: 8080

# On SIGTERM the server finishes in-flight requests and drops connections still open after 10 seconds (the pipeline event
# streams never end on their own), so 30 seconds is enough.
terminationGracePeriodSeconds: 30

# A push is buffered in memory (600 MiB at most, 8 at a time): raise the limit if you expect big pushes in parallel.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 2Gi

# 100 and 101 are the ids adduser -S and addgroup -S give the ferrisgit user in the image (see the Dockerfile).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# The server only writes to /data (the volume) and /tmp (an emptyDir).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

persistence:
  # Keeps both volumes (repositories and database) on uninstall. Delete the PVCs by hand to wipe the data.
  keepOnUninstall: true

storage:
  # Git repositories, release assets: grows with usage.
  size: 20Gi
  storageClassName: "" # empty = cluster default

ingress:
  enabled: true
  className: traefik
  host: app.ferrisgit.pro
  # Traefik's own ACME resolver (HTTP-01), named as in the cluster's Traefik static configuration. It's the default because
  # Traefik answers /.well-known/acme-challenge/ on the web entrypoint for its own resolver, which leaves no room for
  # cert-manager's HTTP-01. Needs a DNS A record from host to the Traefik load balancer, and only works with className
  # traefik. The Ingress then has no TLS secretName: Traefik keeps the certificate in its own store.
  certResolver: letsencrypt-http
  # Alternative: an existing cert-manager ClusterIssuer (letsencrypt-prod, say) with certResolver set to "" (both is an
  # error). The certificate lands in the Secret tlsSecretName. With neither set, no certificate is requested and
  # tlsSecretName has to hold one already.
  clusterIssuer: ""
  tlsSecretName: "" # empty = <release>-tls (cert-manager mode, or an existing Secret); unused with certResolver
  # Traefik Middlewares (namespace-name@kubernetescrd, comma-separated). They have to exist already, or Traefik drops the
  # route: https (redirect to HTTPS) and headers (security headers), both in the traefik namespace. No rate-limit
  # middleware on purpose, since a clone or a push is a burst of requests it would reject. "" uses none.
  middlewares: "traefik-https@kubernetescrd,traefik-headers@kubernetescrd"
  # Traefik TLSOption (name@kubernetescrd) that has to exist already: mintls13 in the traefik namespace, TLS 1.3 minimum.
  # "" uses Traefik's defaults.
  tlsOptions: "traefik-mintls13@kubernetescrd"
  annotations: {}

networkPolicy:
  # Only the FerrisGit pod may connect to PostgreSQL, not the CI job pods. Needs a CNI that enforces NetworkPolicy.
  enabled: true
  # Who may reach the FerrisGit pod, as NetworkPolicy peers. Empty means anyone. An ingress controller in another
  # namespace has to be listed here, for example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: traefik
  appIngressFrom: []

ferrisgit:
  # Creates the first administrator, only while the users table is empty, with the password secrets.bootstrapAdminPassword.
  # An empty username turns it off.
  bootstrapAdminUsername: admin
  rustLog: info
  # Public address of the app (scheme and host, no path). Empty means https://<ingress.host>. Passkeys need it to match the
  # browser's origin.
  publicUrl: ""
  # The ingress controller's pod network, as comma-separated CIDRs (for example "10.42.0.0/16"). X-Forwarded-For is only
  # trusted from there. Left empty, every visitor looks like the ingress pod and they all share one rate-limit budget for
  # sign-in, registration and activation, so with ingress.enabled the chart won't render unless allowSharedRateLimit is
  # true. Several CIDRs on the command line: --set-string ferrisgit.trustedProxyCidrs='10.42.0.0/16\,10.43.0.0/16', or
  # use a values file.
  trustedProxyCidrs: ""
  # Allows an empty trustedProxyCidrs behind the ingress: every visitor then shares one rate-limit budget.
  allowSharedRateLimit: false
  # Extra environment variables for the server container, as a list of {name, value}.
  extraEnv: []

# Kubernetes execution engine, where each CI job runs as a Pod. The FerrisGit pod gets a ServiceAccount with the Role the
# README documents (pods, pods/log, persistentvolumeclaims, never Secrets). The engine itself is picked in the admin
# settings. Disabled, the pod gets no API token and only Docker runners work.
kubernetesExecutor:
  enabled: true
  # Namespace the job Pods run in; empty means the release namespace. Another one has to exist already, and the same value
  # goes in k8s_namespace in the admin settings (the server only detects its own namespace).
  namespace: ""
  # A ClusterRole with get and list on storageclasses, only there to pre-fill k8s_cache_storage_class. Optional.
  detectStorageClass: true

postgres:
  image: postgres:18-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
  user: ferrisgit
  database: ferrisgit
  # 70 is the postgres user of the alpine image.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  storage:
    size: 10Gi
    storageClassName: "" # empty = cluster default
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# Left empty, Helm generates each of these on first install (templates/secret.yaml) and finds them again on upgrade with
# lookup. Under helm template, --dry-run, Argo CD or Flux, lookup returns nothing and every render would invent new values
# (a database password nobody knows, an encryption key that makes stored CI variables unreadable), so set all four
# yourself. An explicit value wins over the stored one, except postgresPassword: PostgreSQL only reads it when it
# initialises an empty volume. The Secret has helm.sh/resource-policy: keep.
secrets:
  postgresPassword: ""
  # At least 32 characters.
  jwtSecret: ""
  # Exactly 32 characters. Encrypts CI variables, webhook secrets, the SMTP password and TOTP secrets at rest. It can't be
  # rotated: changing it makes them unreadable.
  settingsEncryptionKey: ""
  # At least 8 characters.
  bootstrapAdminPassword: ""
