services:
  postgres:
    image: postgres:18-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ferrisgit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ferrisgit
    volumes:
      - ferrisgit-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrisgit"]
      interval: 5s
      timeout: 5s
      retries: 10

  ferrisgit-server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ferrisgit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/ferrisgit
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Exactly 32 characters, and it can't be rotated (see the README, Configuration).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY must be set}
      # The server won't start without PUBLIC_URL. This is the local stack, so it gets a default, which also lets
      # docker compose commands run without it, even for the database alone.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # CIDRs of the reverse proxy in front of this container, if any (see the README). Empty means X-Forwarded-For is ignored.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      STORAGE_ROOT: /data
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      FERRISGIT_BOOTSTRAP_ADMIN_USERNAME: ${FERRISGIT_BOOTSTRAP_ADMIN_USERNAME:-}
      FERRISGIT_BOOTSTRAP_ADMIN_PASSWORD: ${FERRISGIT_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - ferrisgit-storage:/data

volumes:
  ferrisgit-postgres-data:
  ferrisgit-storage:
