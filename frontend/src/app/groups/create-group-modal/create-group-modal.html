<form (submit)="$event.preventDefault(); submit()">
  <gbt-modal [isOpen]="true" [heading]="'groups.create.title' | transloco" [closeLabel]="'common.close' | transloco" [busy]="creating()" [busyLabel]="'common.creating' | transloco" (closed)="close.emit()">
    <div class="create-group">
      <gbt-input
        class="create-group__name"
        name="name"
        [label]="'groups.create.name' | transloco"
        placeholder="acme"
        [hint]="'groups.create.hint' | transloco"
        required
        [errorMessage]="nameError()"
        [ngModel]="name()"
        (ngModelChange)="onNameChange($event)"
      />
      <gbt-textarea
        class="create-group__description"
        name="description"
        [label]="'common.description' | transloco"
        [placeholder]="'groups.create.purpose' | transloco"
        [rows]="3"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
      />
      @if (formError(); as message) {
        <gbt-alert variant="error">{{ message }}</gbt-alert>
      }
    </div>
    <div modal-footer>
      <gbt-button variant="secondary" [text]="'common.cancel' | transloco" [disabled]="creating()" (clicked)="close.emit()" />
      <gbt-button type="submit" iconName="plus" [text]="'groups.create.submit' | transloco" [loading]="creating()" [loadingLabel]="'common.creating' | transloco" />
    </div>
  </gbt-modal>
</form>
