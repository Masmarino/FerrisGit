<nav class="pipeline-sidebar" [attr.aria-label]="'pipelines.navigation' | transloco">
  <a
    class="pipeline-sidebar__link"
    [class.pipeline-sidebar__link--active]="selectedJobId() === null"
    [attr.aria-current]="selectedJobId() === null ? 'page' : null"
    [routerLink]="summaryLink()"
  >
    {{ 'pipelines.summary' | transloco }}
  </a>
  @for (group of groups(); track group.name) {
    <h3 class="pipeline-sidebar__stage">{{ group.name }}</h3>
    <ul class="pipeline-sidebar__jobs">
      @for (job of group.jobs; track job.id) {
        <li>
          <a
            class="pipeline-sidebar__link"
            [class.pipeline-sidebar__link--active]="selectedJobId() === job.id"
            [attr.aria-current]="selectedJobId() === job.id ? 'page' : null"
            [routerLink]="jobLink(job.id)"
          >
            <gbt-job-status [status]="glyph(job.status)" [label]="statusLabels[job.status]" />
            <span class="pipeline-sidebar__name">{{ job.name }}</span>
            <span class="pipeline-sidebar__duration">{{ duration(job) }}</span>
          </a>
        </li>
      }
    </ul>
  }
</nav>
