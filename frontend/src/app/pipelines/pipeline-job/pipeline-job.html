<section class="pipeline-job">
  <header class="pipeline-job__header">
    <h2>
      <gbt-job-status [status]="glyph()" [label]="statusLabel()" />
      {{ job().name }}
    </h2>
    <p class="pipeline-job__meta">
      <span>{{ statusLabel() }}</span>
      <span class="pipeline-job__duration">{{ duration() }}</span>
    </p>
    @if (job().needs.length > 0) {
      <p class="pipeline-job__needs">{{ 'pipelines.dependsOn' | transloco: { jobs: job().needs.join(', ') } }}</p>
    }
  </header>

  <gbt-stepper
    class="pipeline-job__stepper"
    [steps]="steps()"
    [activeIndex]="activeStageIndex()"
    [interactive]="true"
    [selectedIndex]="selectedIndex()"
    (selectedIndexChange)="onStepSelected($event)"
    [completedLabel]="'common.done' | transloco"
    [errorLabel]="'pipelines.inError' | transloco"
    [selectedLabel]="'pipelines.selected' | transloco"
  />

  <pre
    #logs
    class="pipeline-job__logs"
    role="region"
    tabindex="0"
    [attr.aria-label]="'pipelines.logsOf' | transloco: { name: job().name }"
    (scroll)="onScroll(logs)"
  >{{ job().logs || logPlaceholder() }}</pre>
</section>
