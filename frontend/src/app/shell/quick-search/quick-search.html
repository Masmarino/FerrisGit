<gbt-command-palette
  [ariaLabel]="'shell.quickSearch.label' | transloco"
  [placeholder]="'shell.searchOrGo' | transloco"
  [loadingLabel]="'shell.quickSearch.searching' | transloco"
  [emptyMessage]="'common.noResults' | transloco"
  [navigateHint]="'shell.quickSearch.navigate' | transloco"
  [selectHint]="'shell.quickSearch.open' | transloco"
  [closeHint]="'common.close' | transloco"
  [closeLabel]="'shell.quickSearch.closeSearch' | transloco"
  [shortcuts]="shortcuts"
  [groups]="groups()"
  [loading]="searching()"
  [resultsAnnouncement]="resultsAnnouncement"
  [(open)]="open"
  (queryChange)="onQueryChange($event)"
  (itemSelected)="onSelect($event)"
/>
