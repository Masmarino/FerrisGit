<article class="mr-comment">
  <gbt-card variant="outlined" [flush]="true">
    <div card-header class="mr-comment__header">
      <p class="mr-comment__byline">
        <strong class="mr-comment__author">{{ authorName() }}</strong>&ngsp;
        <span class="mr-comment__verb">{{ verb() }}</span>
      </p>
      @if (badge()) {
        <span class="mr-comment__badge">{{ badge() }}</span>
      }
      <time class="mr-comment__date" [attr.datetime]="createdAt()" [title]="createdAt() | gbtDateTime : { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }">{{ createdAt() | gbtRelativeTime : { style: 'short', maxUnit: 'day', absoluteAfterDays: 30 } }}</time>
      <!-- Hung on the rail beside the byline. Last in the DOM so screen readers get the byline first. -->
      <gbt-avatar class="mr-comment__avatar" [name]="authorName()" />
    </div>
    <p class="mr-comment__body">{{ body() }}</p>
  </gbt-card>
</article>
