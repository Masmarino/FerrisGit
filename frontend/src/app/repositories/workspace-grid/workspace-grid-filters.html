<gbt-panel [heading]="'common.searchTitle' | transloco" [headingLevel]="2">
  <gbt-input
    class="workspace-grid-filters__search"
    [label]="grid().searchLabel()"
    hideLabel
    [placeholder]="'repositories.search' | transloco"
    [ngModel]="grid().search()"
    (ngModelChange)="grid().search.set($event)"
  />
</gbt-panel>

<gbt-panel [heading]="'common.sort' | transloco" [headingLevel]="2">
  <div class="workspace-grid-filters__sort">
    <gbt-select [label]="'common.sortBy' | transloco" hideLabel fullWidth [options]="sortOptions()" [ngModel]="grid().sortValue()" (ngModelChange)="grid().sortValue.set($event)" />
    <gbt-segmented-control
      class="workspace-grid-filters__direction"
      [ariaLabel]="'common.sortDirection' | transloco"
      tinted
      fullWidth
      [options]="directionOptions"
      [value]="grid().direction()"
      (valueChange)="grid().direction.set($event)"
    />
  </div>
</gbt-panel>
