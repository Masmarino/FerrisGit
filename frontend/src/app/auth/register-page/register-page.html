<gbt-auth-panel [heading]="heading()" [intro]="intro()">
  <gbt-git-field auth-backdrop />
  <picture auth-logo fgAuthLogo></picture>

  @switch (registration()) {
    @case ('loading') {
      <span class="sr-only" role="status">{{ 'common.loadingInProgress' | transloco }}</span>
      <div class="loading" aria-hidden="true">
        <gbt-skeleton width="9rem" height="1.5rem" />
        <gbt-skeleton width="100%" height="var(--gbt-control-height-md)" />
        <gbt-skeleton width="100%" height="var(--gbt-control-height-md)" />
        <gbt-skeleton width="100%" height="2.75rem" />
      </div>
    }
    @case ('closed') {
      <gbt-empty-state
        class="gbt-auth-panel__status"
        icon="lock"
        [headingLevel]="1"
        headingFocusable
        [heading]="'auth.register.closedTitle' | transloco"
        [message]="'auth.register.closedMessage' | transloco"
      >
        <gbt-button class="gbt-auth-panel__submit" block size="large" [text]="'auth.signIn' | transloco" (clicked)="toSignIn()" />
      </gbt-empty-state>
    }
    @case ('sent') {
      <gbt-empty-state
        class="gbt-auth-panel__status gbt-auth-panel__status--success"
        icon="circle-check"
        [headingLevel]="1"
        headingFocusable
        [heading]="'auth.register.sentTitle' | transloco"
        [message]="sentMessage()"
      >
        <p class="resend-hint">{{ 'auth.register.resendHint' | transloco }}</p>
        <gbt-button class="gbt-auth-panel__submit" block size="large" [text]="'auth.signIn' | transloco" (clicked)="toSignIn()" />
      </gbt-empty-state>
    }
    @default {
      <form class="gbt-auth-panel__form" (ngSubmit)="submit()" novalidate>
        @if (formError()) {
          <gbt-alert variant="error" appearance="subtle" iconAlign="start">{{ formError() }}</gbt-alert>
        }

        <gbt-input
          [id]="usernameId"
          name="username"
          autocomplete="username"
          [label]="'auth.register.username' | transloco"
          [hint]="usernameHint"
          [errorMessage]="usernameError()"
          [ngModel]="username()"
          (ngModelChange)="onUsernameChange($event)"
        />

        <gbt-input
          [id]="emailId"
          type="email"
          name="email"
          autocomplete="email"
          [label]="'auth.register.email' | transloco"
          [hint]="'auth.register.emailHint' | transloco"
          [errorMessage]="emailError()"
          [ngModel]="email()"
          (ngModelChange)="onEmailChange($event)"
        />

        <gbt-button
          class="gbt-auth-panel__submit"
          block
          type="submit"
          size="large"
          [text]="'auth.register.submit' | transloco"
          [loading]="submitting()"
          [loadingLabel]="'auth.register.submitting' | transloco"
        />
      </form>

      <gbt-auth-footer [text]="'auth.register.haveAccount' | transloco">
        <a gbtButton variant="link" gbtAuthFooterLink routerLink="/login">{{ 'auth.signIn' | transloco }}</a>
      </gbt-auth-footer>
    }
  }
</gbt-auth-panel>
