<gbt-card class="public-not-found" variant="outlined">
  <gbt-empty-state
    illustration="folder"
    [headingLevel]="1"
    [heading]="'public.notFound.title' | transloco"
    [message]="'public.notFound.message' | transloco"
  >
    <div class="public-not-found__actions">
      <a gbtButton variant="primary" [routerLink]="login.commands" [queryParams]="login.queryParams">{{ 'auth.signIn' | transloco }}</a>
      <a gbtButton variant="secondary" routerLink="/explore">{{ 'common.exploreRepositories' | transloco }}</a>
    </div>
  </gbt-empty-state>
</gbt-card>
