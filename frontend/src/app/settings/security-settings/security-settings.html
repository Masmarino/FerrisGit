<!-- One form for the whole section: "Enregistrer" sends every change together. -->
<form ngNoForm class="security-settings" novalidate (submit)="$event.preventDefault(); save()">
  <gbt-card variant="outlined" icon="lock" [heading]="'settings.security.sessions' | transloco" [description]="'settings.security.sessionsHelp' | transloco">
    <div class="admin-settings__field admin-settings__jwt" data-field="jwtTtlHours">
      <gbt-input type="number" min="1" [label]="'settings.security.jwt' | transloco" [errorMessage]="jwtError()" [ngModel]="jwt()" (ngModelChange)="jwt.set($event)" />
      <div class="admin-settings__field-footer">
        <p class="admin-settings__hint">{{ 'settings.security.jwtHint' | transloco }}</p>
      </div>
    </div>
  </gbt-card>

  <gbt-card variant="outlined" icon="user-plus" [heading]="'settings.security.registration' | transloco" [description]="'settings.security.registrationHelp' | transloco">
    <div class="admin-settings__field admin-settings__switch" data-field="registrationEnabled">
      <gbt-switch [label]="'settings.security.allowRegistration' | transloco" [ngModel]="registration()" (ngModelChange)="registration.set($event)" />
      <div class="admin-settings__field-footer">
        <p class="admin-settings__hint">
          {{ 'settings.security.registrationHint' | transloco }}
        </p>
      </div>
    </div>
  </gbt-card>

  <gbt-card variant="outlined" icon="globe" [heading]="'settings.security.publicPages' | transloco" [description]="'settings.security.publicPagesHelp' | transloco">
    <div class="admin-settings__form">
      <div class="admin-settings__field admin-settings__switch" data-field="publicPagesEnabled">
        <gbt-switch [label]="'settings.security.publicPages' | transloco" [ngModel]="publicPages()" (ngModelChange)="publicPages.set($event)" />
        <div class="admin-settings__field-footer">
          <p class="admin-settings__hint">
            {{ 'settings.security.publicPagesHint' | transloco }}
          </p>
        </div>
      </div>
      <div class="admin-settings__field admin-settings__switch" data-field="seoIndexingEnabled">
        <gbt-switch [label]="'settings.security.seo' | transloco" [disabled]="!publicPages()" [ngModel]="seoIndexing()" (ngModelChange)="seoIndexing.set($event)" />
        <div class="admin-settings__field-footer">
          <p class="admin-settings__hint">{{ 'settings.security.seoHint' | transloco }}</p>
        </div>
      </div>
    </div>
  </gbt-card>

  <gbt-card variant="outlined" icon="upload" [heading]="'settings.security.pushes' | transloco" [description]="'settings.security.pushesHelp' | transloco">
    <div class="admin-settings__field admin-settings__push-size" data-field="maxPushSizeMb">
      <gbt-slider [label]="'settings.security.maxPush' | transloco" [min]="1" [max]="600" [ngModel]="maxPushSize()" (ngModelChange)="maxPushSize.set($event)" [formatValue]="maxPushSizeFormat" />
      <div class="admin-settings__field-footer">
        <p class="admin-settings__hint">{{ 'settings.security.pushHint' | transloco }}</p>
      </div>
    </div>
  </gbt-card>

  <fg-settings-save-bar [dirty]="dirty()" [saving]="saving()" (discard)="discard()" />
</form>
