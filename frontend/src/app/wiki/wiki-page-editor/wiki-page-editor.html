<fg-wiki-layout [repositoryId]="repositoryId()" [path]="path()" [currentSlug]="slug()" [offerCreate]="!isCreate()" (loaded)="onListLoaded($event)" (loadFailed)="onListFailed()">
  <div class="wiki-page-editor">
    <gbt-page-header [heading]="heading()" />

    @if (conflict()) {
      <gbt-alert class="wiki-page-editor__conflict" variant="warning">{{ conflictMessage }}</gbt-alert>
    }

    @if (isCreate()) {
      <gbt-input
        class="wiki-page-editor__slug"
        [label]="'wiki.pageName' | transloco"
        placeholder="Getting-Started"
        [hint]="'wiki.pageNameHint' | transloco"
        [ngModel]="newSlug()"
        (ngModelChange)="newSlug.set($event)"
      />
    }

    <gbt-list-card [ariaLabel]="'wiki.content' | transloco">
      <div class="wiki-page-editor__panes">
        <div class="wiki-page-editor__pane wiki-page-editor__source">
          <div class="wiki-page-editor__pane-header">
            <gbt-icon name="pencil" aria-hidden="true" />
            <label [for]="ids.source">{{ 'common.markdown' | transloco }}</label>
          </div>
          <textarea
            class="wiki-page-editor__textarea"
            [id]="ids.source"
            spellcheck="true"
            [placeholder]="'wiki.sourcePlaceholder' | transloco"
            [value]="content()"
            (input)="content.set($any($event.target).value)"
          ></textarea>
        </div>
        <div class="wiki-page-editor__pane wiki-page-editor__preview" role="region" [attr.aria-labelledby]="ids.preview">
          <div class="wiki-page-editor__pane-header">
            <gbt-icon name="book-open" aria-hidden="true" />
            <span [id]="ids.preview">{{ 'nav.overview' | transloco }}</span>
          </div>
          <div class="wiki-page-editor__preview-body">
            @if (content().trim()) {
              <fg-markdown-view [content]="content()" [headingOffset]="1" />
            } @else {
              <p class="wiki-page-editor__preview-empty">{{ 'wiki.previewEmpty' | transloco }}</p>
            }
          </div>
        </div>
      </div>
    </gbt-list-card>

    <div class="wiki-page-editor__footer">
      <gbt-input class="wiki-page-editor__message" [label]="'common.commitMessage' | transloco" [placeholder]="messagePlaceholder()" [ngModel]="message()" (ngModelChange)="message.set($event)" />
      <div class="wiki-page-editor__actions">
        <gbt-button variant="secondary" [text]="'common.cancel' | transloco" (clicked)="cancel()" />
        <gbt-button [text]="(isCreate() ? 'wiki.createPage' : 'common.save') | transloco" [loading]="saving()" [loadingLabel]="'common.saving' | transloco" (clicked)="save()" />
      </div>
    </div>
  </div>
</fg-wiki-layout>
