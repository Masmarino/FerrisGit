[workspace]
resolver = "3"
members = [
    "crates/ferrisgit-domain",
    "crates/ferrisgit-application",
    "crates/ferrisgit-infrastructure",
    "crates/ferrisgit-api",
    "crates/ferrisgit-runner",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
rust-version = "1.98"
repository = "https://github.com/Masmarino/FerrisGit"
publish = false

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
kube = { version = "4.2", default-features = false, features = ["rustls-tls", "aws-lc-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
webauthn-rs = "0.5.5"
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
tempfile = "3"
sha2 = "0.11"
hex = "0.4"

# Line tables are enough for RUST_BACKTRACE=1 to show file:line. Full debug info only helps in a debugger and is what
# bloats target/ (every integration test links its own binary). Test builds inherit this from dev.
[profile.dev]
debug = "line-tables-only"

# Thin LTO and one codegen unit give a smaller, faster binary without the build time of fat LTO.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
