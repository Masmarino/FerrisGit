[package]
name = "ferrisgit-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferrisgit-domain = { path = "../ferrisgit-domain" }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
rand = "0.10"
tracing.workspace = true
url.workspace = true
totp-rs = { version = "6.0.0", default-features = false, features = ["otpauth", "std"] }
subtle = "2"
webauthn-rs.workspace = true

[dev-dependencies]
# Real registration/authentication ceremonies in the PasskeyService tests. 0.5.x is the line built against
# webauthn-rs 0.5 (0.6.x pins webauthn-rs-core 0.6 and would hand over incompatible proto types).
webauthn-authenticator-rs.workspace = true
