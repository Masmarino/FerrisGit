[package]
name = "ferrisgit-cli"
description = "fgit, the command-line client of FerrisGit, for people, scripts and AI agents"
readme = "README.md"
keywords = ["git", "ferrisgit", "cli", "forge"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
version.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# The one crate of the workspace published on crates.io, under this name because `fgit` is taken there. It only speaks to
# the server over HTTP, so nothing here depends on the other crates.
publish = true

[[bin]]
name = "fgit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
dirs = "7"
futures-util = "0.3"
jaq-core = "3.1"
jaq-json = "2.0"
jaq-std = "3.0"
keyring = "4.2"
open = "5.4"
reqwest = { workspace = true, features = ["multipart", "stream"] }
rpassword = "7.5"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

# What tests/fgit_flow.rs needs to run a real server. Path-only dev-dependencies are dropped from what gets published, so
# the published crate still depends on none of these.
[dev-dependencies]
async-trait.workspace = true
axum = "0.8"
base64 = "0.23"
chrono.workspace = true
ferrisgit-api = { path = "../ferrisgit-api" }
ferrisgit-application = { path = "../ferrisgit-application" }
ferrisgit-domain = { path = "../ferrisgit-domain" }
ferrisgit-infrastructure = { path = "../ferrisgit-infrastructure" }
sqlx.workspace = true
tempfile.workspace = true
uuid.workspace = true
webauthn-authenticator-rs.workspace = true
webauthn-rs.workspace = true
