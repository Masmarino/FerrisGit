[package]
name = "ferrisgit-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferrisgit-domain = { path = "../ferrisgit-domain" }
ferrisgit-application = { path = "../ferrisgit-application" }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
argon2 = "0.6"
aes-gcm = "0.11"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
serde = { workspace = true }
gix = { version = "0.88", default-features = false, features = ["max-performance-safe", "comfort", "basic", "revision", "sha1"] }
kube = { workspace = true, features = ["client", "runtime", "derive"] }
libc = "0.2"
k8s-openapi = { version = "0.28", features = ["latest"] }
futures = "0.3"
similar = "3"
reqwest.workspace = true
hmac = "0.13"
sha2.workspace = true
hex.workspace = true
hkdf = "0.13"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "aws-lc-rs", "webpki-roots", "smtp-transport", "builder"] }

[features]
# Exposes `kubernetes::test_support` (kind-cluster helpers: test_client, TestNamespace, ...)
# outside of this crate's own `#[cfg(test)]` unit tests, so the Cargo integration test in
# `tests/` can use the exact same real-cluster helpers. Never enabled in a normal build —
# only turned on via the self-dependency below, which applies solely to `cargo test`.
test-support = []
# Gates the integration tests below, which need a real `kind` Kubernetes cluster
# (`test_client()` panics without one). Off by default so `cargo test --workspace`
# — CI's default — never touches them; run them locally with
# `cargo test -p ferrisgit-infrastructure --features kind-tests` once a kind cluster is up.
kind-tests = []

[[test]]
name = "kubernetes_capstone"
required-features = ["kind-tests"]

[[test]]
name = "kubernetes_hot_swap"
required-features = ["kind-tests"]

[dev-dependencies]
tempfile.workspace = true
# Self-dependency purely to turn on the `test-support` feature for this crate's own
# integration tests (tests/): Cargo unifies features across the dependency graph for a
# build, so declaring ourselves here with the feature enabled makes `kubernetes::test_support`
# visible to code in `tests/`, without ever shipping it in a normal (non-test) build.
ferrisgit-infrastructure = { path = ".", features = ["test-support"] }
