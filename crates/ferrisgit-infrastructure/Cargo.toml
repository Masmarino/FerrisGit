[package]
name = "ferrisgit-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferrisgit-domain = { path = "../ferrisgit-domain" }
ferrisgit-application = { path = "../ferrisgit-application" }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
argon2 = "0.6"
aes-gcm = "0.11"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
serde = { workspace = true }
gix = { version = "0.88", default-features = false, features = ["max-performance-safe", "comfort", "basic", "revision", "sha1"] }
kube = { workspace = true, features = ["client", "runtime", "derive"] }
libc = "0.2"
k8s-openapi = { version = "0.28", features = ["latest"] }
futures = "0.3"
similar = "3"
reqwest.workspace = true
hmac = "0.13"
sha2.workspace = true
hex.workspace = true
hkdf = "0.13"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "aws-lc-rs", "webpki-roots", "smtp-transport", "builder"] }

[features]
# Exposes kubernetes::test_support (kind-cluster helpers) to the integration tests in tests/, not just to this crate's own
# unit tests. Never on in a normal build, only through the self-dependency below, which applies to cargo test.
test-support = []
# Gates the integration tests below, which need a real kind cluster (test_client() panics without one). Off by default so
# `cargo test --workspace`, which is what CI runs, never touches them. Locally, once a kind cluster is up:
# `cargo test -p ferrisgit-infrastructure --features kind-tests`.
kind-tests = []

[[test]]
name = "kubernetes_capstone"
required-features = ["kind-tests"]

[[test]]
name = "kubernetes_hot_swap"
required-features = ["kind-tests"]

[dev-dependencies]
tempfile.workspace = true
# Self-dependency whose only job is to switch on test-support for the integration tests in tests/. Cargo unifies features
# across the build, so kubernetes::test_support becomes visible there without shipping in a normal build.
ferrisgit-infrastructure = { path = ".", features = ["test-support"] }
