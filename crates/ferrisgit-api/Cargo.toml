[package]
name = "ferrisgit-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ferrisgit-api"
path = "src/main.rs"

[lib]
name = "ferrisgit_api"
path = "src/lib.rs"

[dependencies]
ferrisgit-domain = { path = "../ferrisgit-domain" }
ferrisgit-application = { path = "../ferrisgit-application" }
ferrisgit-infrastructure = { path = "../ferrisgit-infrastructure" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "set-header"] }
base64 = "0.23"
kube = { workspace = true, features = ["client"] }
url.workspace = true
# The route types (challenge responses, credentials) come from webauthn-rs.
webauthn-rs.workspace = true
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
reqwest = { workspace = true, features = ["multipart", "query"] }
# A plain path dev-dependency on ferrisgit-runner wouldn't set CARGO_BIN_EXE_ferrisgit-runner here: Cargo only sets it for
# binaries of the test's own package, and a path dependency on a crate without a lib target is silently dropped.
# escargot builds the binary at test time and hands back its path.
escargot = "0.5"
# Software authenticator for the passkey flow tests. Stays on 0.5.x to match webauthn-rs 0.5 (see the application crate).
webauthn-authenticator-rs.workspace = true
