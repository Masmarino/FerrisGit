apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ferrisgit-postgres-data
  namespace: ferrisgit
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrisgit-postgres
  namespace: ferrisgit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ferrisgit-postgres
  template:
    metadata:
      labels:
        app: ferrisgit-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine3.24
          env:
            - name: POSTGRES_USER
              value: ferrisgit
            - name: POSTGRES_DB
              value: ferrisgit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ferrisgit-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ferrisgit"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ferrisgit-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: ferrisgit-postgres
  namespace: ferrisgit
spec:
  selector:
    app: ferrisgit-postgres
  ports:
    - port: 5432
      targetPort: 5432
