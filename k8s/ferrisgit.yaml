apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ferrisgit-storage
  namespace: ferrisgit
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrisgit-server
  namespace: ferrisgit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ferrisgit-server
  template:
    metadata:
      labels:
        app: ferrisgit-server
    spec:
      serviceAccountName: ferrisgit-ci
      # The image runs as uid 100 / gid 101 (ferrisgit); without fsGroup the freshly provisioned
      # PVC is root-owned and repository creation fails with "Permission denied" on /data.
      securityContext:
        fsGroup: 101
      imagePullSecrets:
        - name: alume-registry
      containers:
        - name: ferrisgit-server
          image: alume.artiferris.pro/alume-docker/ferrisgit:latest
          imagePullPolicy: Always
          env:
            # Must precede DATABASE_URL: Kubernetes only expands $(VAR) against variables
            # defined earlier in this same list.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ferrisgit-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://ferrisgit:$(POSTGRES_PASSWORD)@ferrisgit-postgres:5432/ferrisgit
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrisgit-secrets
                  key: JWT_SECRET
            - name: SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ferrisgit-secrets
                  key: SETTINGS_ENCRYPTION_KEY
            # Public origin of the app (no path): links sent by e-mail (account activation) are built from it.
            - name: PUBLIC_URL
              value: https://app.ferrisgit.pro
            # The networks the ingress controller connects from (pod IPs of this cluster are 10.2.0.x): for a
            # connection from there, the per-IP rate limits (login, registration, activation) use the client
            # address from X-Forwarded-For instead of the ingress pod's own. It must cover the ingress
            # controller ONLY, never a range that arbitrary clients or untrusted workloads can connect from.
            - name: TRUSTED_PROXY_CIDRS
              value: 10.2.0.0/16
            - name: STORAGE_ROOT
              value: /data
            - name: BIND_ADDR
              value: 0.0.0.0:8080
            - name: RUST_LOG
              value: info
            - name: FERRISGIT_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: FERRISGIT_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ferrisgit-secrets
                  key: BOOTSTRAP_ADMIN_PASSWORD
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: storage
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: ferrisgit-storage
---
apiVersion: v1
kind: Service
metadata:
  name: ferrisgit-server
  namespace: ferrisgit
spec:
  selector:
    app: ferrisgit-server
  ports:
    - port: 8080
      targetPort: 8080
