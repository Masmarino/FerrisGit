# Public entrypoint: https://app.ferrisgit.pro
# TLS follows this cluster's convention: Traefik's own `letsencrypt-http` certificate resolver
# (HTTP-01). cert-manager's HTTP-01 can't be used here — Traefik intercepts
# /.well-known/acme-challenge/ on the `web` entrypoint for its own resolver.
# Requires a DNS A record `app.ferrisgit.pro` -> the Traefik load balancer address.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ferrisgit
  namespace: ferrisgit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-http
    traefik.ingress.kubernetes.io/router.middlewares: traefik-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: app.ferrisgit.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ferrisgit-server
                port:
                  number: 8080
