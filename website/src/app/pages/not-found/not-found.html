<header class="not-found__bar">
  <div class="container">
    <a class="not-found__brand" [routerLink]="['/', 'en']" aria-label="FerrisGit">
      <img src="images/logo-128.png" width="36" height="36" alt="" />
      <span aria-hidden="true">FerrisGit</span>
    </a>
  </div>
</header>
<main class="not-found container" id="main-content">
  <p class="not-found__code">404</p>
  <h1>{{ 'notFound.title' | transloco }}</h1>
  <p class="lead">{{ 'notFound.text' | transloco }}</p>
  <nav [attr.aria-label]="'notFound.languages' | transloco">
    <ul class="not-found__langs">
      @for (lang of langs; track lang) {
        <li>
          <a gbtButton variant="secondary" size="large" [routerLink]="['/', lang]" [lang]="lang">{{
            names[lang]
          }}</a>
        </li>
      }
    </ul>
  </nav>
</main>
<app-footer />
