<details #details class="lang">
  <summary class="lang__summary" [attr.aria-label]="'language.label' | transloco">
    <gbt-icon name="globe" />
    <span class="lang__code" aria-hidden="true">{{ activeLang().toUpperCase() }}</span>
    <gbt-icon class="lang__chevron" name="chevron-down" />
  </summary>
  <ul class="lang__list">
    @for (lang of langs; track lang) {
      <li>
        <a
          [routerLink]="commands(lang)"
          [lang]="lang"
          [attr.hreflang]="lang"
          [attr.aria-current]="lang === activeLang() ? 'true' : null"
          (click)="close()"
          >{{ names[lang] }}</a
        >
      </li>
    }
  </ul>
</details>
