# FerrisGit's own pipeline, run by FerrisGit: the checks of the GitHub workflow (.github/workflows/ci-cd.yml) without
# what ships (the Docker images, the GitHub release, the deployments).
#
# It needs a Docker runner: only those clone the repository into the job (the Kubernetes engine does not). Jobs get no
# Docker daemon, so the images are not built here, and caches have no effect with Docker runners: each job downloads
# and compiles from scratch. Script lines are joined with `&&`: the first one that fails fails the job.
#
# Images are pinned by digest, as in the GitHub workflow, so a retagged image cannot change what runs. To move to a
# newer one: `docker buildx imagetools inspect <image:tag>` gives the digest to put after the tag.
stages: [check, test, build]

jobs:
  rust-format:
    stage: check
    image: rust:1.98.1@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546
    script:
      - rustup component add rustfmt
      - cargo fmt --all --check

  rust-clippy:
    stage: check
    image: rust:1.98.1@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546
    variables:
      SQLX_OFFLINE: "true"
    script:
      - rustup component add clippy
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-audit:
    stage: check
    image: rust:1.98.1@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546
    script:
      - cargo install cargo-audit --version 0.22.2 --locked
      - cargo audit

  # Both charts must lint and render; the deployments pass the real image tags.
  helm-lint:
    stage: check
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    script:
      - apk add --no-cache helm
      - helm lint --strict ./helm/ferrisgit --set image.tag=0.0.0-ci --set-string ferrisgit.trustedProxyCidrs=10.42.0.0/16
      - helm template ferrisgit ./helm/ferrisgit --namespace ferrisgit --set image.tag=0.0.0-ci --set-string ferrisgit.trustedProxyCidrs=10.42.0.0/16 > /dev/null
      - helm lint --strict ./website/helm/ferrisgit-website --set image.tag=0.0.0-ci
      - helm template ferrisgit-website ./website/helm/ferrisgit-website --namespace ferrisgit-website --set image.tag=0.0.0-ci > /dev/null

  website-lint:
    stage: check
    image: node:26@sha256:32fa97f3363975684b08bf4e8a68a47c7905175cc20275b50b974bbd02aba731
    variables:
      CI: "true"
    script:
      - cd website
      - npm ci
      - npm run lint

  # The integration tests need PostgreSQL, and a job has no service next to it: the job runs its own, in the container.
  # sqlx::test creates a database per test, so the role needs CREATEDB, which the postgres superuser has. One test
  # thread, because the from_env tests of ferrisgit-api's config.rs change environment variables.
  rust-test:
    stage: test
    image: rust:1.98.1@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546
    needs: [rust-format, rust-clippy]
    variables:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    script:
      - apt-get update -qq
      - apt-get install -y -qq postgresql > /dev/null
      - pg_ctlcluster "$(ls /etc/postgresql)" main start
      - runuser -u postgres -- psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
      - cargo test --workspace --locked -- --test-threads=1

  frontend-test:
    stage: test
    image: node:26@sha256:32fa97f3363975684b08bf4e8a68a47c7905175cc20275b50b974bbd02aba731
    variables:
      CI: "true"
    script:
      - cd frontend
      - npm ci
      - npm test -- --watch=false

  website-test:
    stage: test
    image: node:26@sha256:32fa97f3363975684b08bf4e8a68a47c7905175cc20275b50b974bbd02aba731
    needs: [website-lint]
    variables:
      CI: "true"
    script:
      - cd website
      - npm ci
      - npm test

  frontend-build:
    stage: build
    image: node:26@sha256:32fa97f3363975684b08bf4e8a68a47c7905175cc20275b50b974bbd02aba731
    needs: [frontend-test]
    variables:
      CI: "true"
    script:
      - cd frontend
      - npm ci
      - npm run build -- --configuration production

  website-build:
    stage: build
    image: node:26@sha256:32fa97f3363975684b08bf4e8a68a47c7905175cc20275b50b974bbd02aba731
    needs: [website-test]
    variables:
      CI: "true"
    script:
      - cd website
      - npm ci
      - npm run build
