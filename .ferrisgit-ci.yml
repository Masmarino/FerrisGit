# FerrisGit's own pipeline, run by FerrisGit: the checks of the GitHub workflow (.github/workflows/ci-cd.yml), without
# what ships (the Docker images, the GitHub release, the deployments).
#
# It runs with either engine, since both clone the repository into the job. The Docker images are not built here, even
# when the admin gives jobs Docker, to keep this pipeline to the checks. Caches have no effect with Docker runners: each
# job then downloads and compiles everything from scratch. Script lines are joined with `&&`, so the first one that
# fails fails the job.
#
# Images are pinned by digest, as in the GitHub workflow, so that a retagged image cannot change what runs. To move to a
# newer one, `docker buildx imagetools inspect <image:tag>` gives the digest to put after the tag.
stages: [check, test, build]

jobs:
  rust-format:
    stage: check
    image: rust:1.99.1@sha256:931c2c0531a8b143e044f0f3914dfe802f15bb3d1955f0b657e9359327ac2ffc
    script:
      - rustup component add rustfmt
      - cargo fmt --all --check

  rust-clippy:
    stage: check
    image: rust:1.99.1@sha256:931c2c0531a8b143e044f0f3914dfe802f15bb3d1955f0b657e9359327ac2ffc
    variables:
      SQLX_OFFLINE: "true"
    script:
      - rustup component add clippy
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-audit:
    stage: check
    image: rust:1.99.1@sha256:931c2c0531a8b143e044f0f3914dfe802f15bb3d1955f0b657e9359327ac2ffc
    script:
      - cargo install cargo-audit --version 0.22.2 --locked
      - cargo audit

  # Both charts must lint and render; the deployments pass the real image tags.
  helm-lint:
    stage: check
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    script:
      - apk add --no-cache helm
      - helm lint --strict ./helm/ferrisgit --set image.tag=0.0.0-ci --set-string ferrisgit.trustedProxyCidrs=10.42.0.0/16
      - helm template ferrisgit ./helm/ferrisgit --namespace ferrisgit --set image.tag=0.0.0-ci --set-string ferrisgit.trustedProxyCidrs=10.42.0.0/16 > /dev/null
      - helm lint --strict ./website/helm/ferrisgit-website --set image.tag=0.0.0-ci
      - helm template ferrisgit-website ./website/helm/ferrisgit-website --namespace ferrisgit-website --set image.tag=0.0.0-ci > /dev/null

  website-lint:
    stage: check
    image: node:26.12.1@sha256:a98e6fda54fdbb22d4238054cca9a2a113bcd1191c09193a535aae22f400aa8e
    variables:
      CI: "true"
    script:
      - cd website
      - npm ci
      - npm run lint

  # The integration tests need PostgreSQL, and a job has no service next to it, so the job runs its own in its
  # container. sqlx::test creates a database per test, so the role needs CREATEDB, which the postgres superuser has. One
  # test thread, because the from_env tests of ferrisgit-api's config.rs change environment variables.
  rust-test:
    stage: test
    image: rust:1.99.1@sha256:931c2c0531a8b143e044f0f3914dfe802f15bb3d1955f0b657e9359327ac2ffc
    needs: [rust-format, rust-clippy]
    variables:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    script:
      - apt-get update -qq
      - apt-get install -y -qq postgresql > /dev/null
      - pg_ctlcluster "$(ls /etc/postgresql)" main start
      - runuser -u postgres -- psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
      - cargo test --workspace --locked -- --test-threads=1

  frontend-test:
    stage: test
    image: node:26.12.1@sha256:a98e6fda54fdbb22d4238054cca9a2a113bcd1191c09193a535aae22f400aa8e
    variables:
      CI: "true"
    script:
      - cd frontend
      - npm ci
      - npm test -- --watch=false

  website-test:
    stage: test
    image: node:26.12.1@sha256:a98e6fda54fdbb22d4238054cca9a2a113bcd1191c09193a535aae22f400aa8e
    needs: [website-lint]
    variables:
      CI: "true"
    script:
      - cd website
      - npm ci
      - npm test

  frontend-build:
    stage: build
    image: node:26.12.1@sha256:a98e6fda54fdbb22d4238054cca9a2a113bcd1191c09193a535aae22f400aa8e
    needs: [frontend-test]
    variables:
      CI: "true"
    script:
      - cd frontend
      - npm ci
      - npm run build -- --configuration production

  website-build:
    stage: build
    image: node:26.12.1@sha256:a98e6fda54fdbb22d4238054cca9a2a113bcd1191c09193a535aae22f400aa8e
    needs: [website-test]
    variables:
      CI: "true"
    script:
      - cd website
      - npm ci
      - npm run build
